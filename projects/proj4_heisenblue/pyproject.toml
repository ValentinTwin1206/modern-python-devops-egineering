[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.12",
]
build-backend = "scikit_build_core.build"

[project]
name = "heisenblue"
version = "1.0.0"
description = "A lightweight RDKit + pybind11 sample project for fictional molecular blue scoring"
authors = [
    { name = "Julius Pravtchev" },
    { name = "Valentin Pravtchev" },
]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.4",
    "rdkit>=2024.03",
]

[project.scripts]
heisenblue = "heisenblue.cli:main"

[dependency-groups]
dev = [
    "karva>=0.0.1a5",
    "pytest>=8.3",
]

[tool.scikit-build]
cmake.source-dir = "cpp"
wheel.packages = ["src/heisenblue"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
