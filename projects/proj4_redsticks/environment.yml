name: redsticks

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python=3.12

  # CLI
  - click
  - rich

  # Image / numerical processing
  - pillow
  - numpy

  # MediaPipe native runtime
  - libgl
  - libegl
  - libgles

  # Chemistry
  - rdkit

  # Native C++ extension
  - pybind11
  - cmake
  - ninja

  # Development / testing
  - pytest

  # Packages not available from conda-forge
  - pip
  - pip:
      - mediapipe
