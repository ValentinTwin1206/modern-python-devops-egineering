[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[project]
name = "paiguard"
version = "0.1.0"
description = "Lightweight image content moderation for Python applications."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Julius Pravtchev" },
    { name = "Valentin Pravtchev" }
]

dependencies = [
    "pydantic>=2.0",
    "pillow>=10.0",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "torch>=2.2",
    "transformers>=4.49",
]

[dependency-groups]
dev = [
    "karva>=0.0.1a5",
    "pytest>=8",
    "ruff>=0.15.12",
]

# Install the CPU-only build of PyTorch. Only `torch` uses this index.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 88
