[project]
name = "license-service"
version = "0.1.0"
description = "A small FastAPI service for generating and validating license keys"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.0.0",
    "pytest>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]