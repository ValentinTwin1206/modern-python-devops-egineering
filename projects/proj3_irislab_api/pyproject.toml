[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[project]
name = "irislab-api"
version = "1.0.0"
description = "HTTP API for IrisLab iris-color analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "dnspython>=2.6,<3",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pymongo>=4.10,<5",
    "PyJWT[crypto]>=2.10,<3",
    "pyguard",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10"]

[tool.uv.sources]
pyguard = { path = "../proj1_pyguard" }

