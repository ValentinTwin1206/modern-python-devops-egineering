[build-system]
requires = ["uv_build>=0.11.1,<0.12"]
build-backend = "uv_build"

[project]
name = "irislab-api"
version = "0.0.1"
description = "HTTP API for IrisLab iris-color analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "influxdb-client>=1.48,<2",
    "dnspython>=2.6,<3",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
    "pymongo>=4.10,<5",
    "PyJWT[crypto]>=2.10,<3",
    "uvicorn>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    # TODO: Add "paiguard[models]==0.0.1" as a runtime dependency for image moderation.
    # Keep pAIguard's PyTorch dependency on the CPU index in this deployment.
    "torch>=2.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10"
]

[tool.uv.sources]
paiguard = { index = "modern-python-engineering" }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "modern-python-engineering"
url = "https://dl.cloudsmith.io/public/pravi-brothers/modern-python-engineering/python/simple/"
explicit = true
