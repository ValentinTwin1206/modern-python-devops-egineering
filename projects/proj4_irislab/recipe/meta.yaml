{% set version = "1.0.0" %}

package:
  name: irislab-split
  version: {{ version }}

source:
  path: ..

build:
  number: 0

requirements:
  build:
    - "{{ compiler('cxx') }}"
    - cmake
    - ninja

outputs:

  # -------------------------------------------------------------------------
  # libirislab
  #
  # Standalone C++ color-science library implementing perceptual CIELAB
  # color-distance calculations.
  # -------------------------------------------------------------------------
  - name: libirislab
    version: {{ version }}

    script: build-libirislab.sh   # [unix]
    script: build-libirislab.bat  # [win]

    build:
      run_exports:
        - {{ pin_subpackage('libirislab', max_pin='x.x') }}

    requirements:
      build:
        - "{{ compiler('cxx') }}"
        - cmake
        - ninja

      host: []

      run: []

    test:
      commands:
        - test -f $PREFIX/lib/libirislab${SHLIB_EXT}              # [unix]
        - test -f $PREFIX/include/irislab.hpp                     # [unix]
        - if not exist %LIBRARY_BIN%\\irislab.dll exit 1         # [win]
        - if not exist %LIBRARY_INC%\\irislab.hpp exit 1         # [win]

  # -------------------------------------------------------------------------
  # irislab-tools
  #
  # Python iris-color analysis package, CLI, and pybind11 extension.
  #
  # The Python extension links against libirislab and exposes its native
  # color-distance implementation through irislab._native.
  # -------------------------------------------------------------------------
  - name: irislab-tools
    version: {{ version }}

    script: build-irislab-tools.sh   # [unix]
    script: build-irislab-tools.bat  # [win]

    build:
      entry_points:
        - irislab = irislab.cli:main

    requirements:
      build:
        - "{{ compiler('cxx') }}"
        - cmake
        - ninja

      host:
        - python >=3.12
        - pybind11 >=2.12
        - {{ pin_subpackage('libirislab', exact=True) }}

      run:
        - python >=3.12
        - click
        - pillow
        - rich
        - numpy
        - libgl
        - libegl
        - libgles
        - {{ pin_subpackage('libirislab', exact=True) }}

    test:
      requires:
        - pip

      imports:
        - irislab
        - irislab._native

      commands:
        - python -m pip install mediapipe
        - irislab --help

about:
  home: https://github.com/ValentinTwin1206/modern-python-engineering
  summary: Native and Python tools for iris segmentation and perceptual color analysis.
  description: |
    IrisLab demonstrates a Conda-only Python and C++ application for
    iris-color analysis.

    It ships as two Conda packages:

      * libirislab
        A standalone C++ shared library implementing perceptual CIELAB
        color-distance calculations.

      * irislab-tools
        The Python API, command-line interface, image-analysis pipeline,
        and pybind11 bindings that link against libirislab.

    The application extracts iris pigmentation from images, analyzes color
    characteristics using NumPy, and uses the native C++ library for
    perceptual color-distance calculations.

  license: Apache-2.0