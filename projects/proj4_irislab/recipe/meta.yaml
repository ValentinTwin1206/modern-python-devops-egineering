{% set version = "1.0.0" %}

package:
  name: irislab-split
  version: {{ version }}

source:
  path: ..

build:
  number: 0

requirements:
  build:
    - "{{ compiler('cxx') }}"
    - cmake
    - ninja

outputs:

  # -------------------------------------------------------------------------
  # libiriscolor
  #
  # Standalone C++ color-science library implementing perceptual CIELAB
  # color-distance calculations.
  # -------------------------------------------------------------------------
  - name: libiriscolor
    version: {{ version }}

    script: build-libiriscolor.sh   # [unix]
    script: build-libiriscolor.bat  # [win]

    build:
      run_exports:
        - {{ pin_subpackage('libiriscolor', max_pin='x.x') }}

    requirements:
      build:
        - "{{ compiler('cxx') }}"
        - cmake
        - ninja

      host: []

      run: []

    test:
      commands:
        - test -f $PREFIX/lib/libiriscolor${SHLIB_EXT}              # [unix]
        - test -f $PREFIX/include/iriscolor.hpp                     # [unix]
        - if not exist %LIBRARY_BIN%\\iriscolor.dll exit 1         # [win]
        - if not exist %LIBRARY_INC%\\iriscolor.hpp exit 1         # [win]

  # -------------------------------------------------------------------------
  # irislab-tools
  #
  # Python iris-color analysis package, CLI, and pybind11 extension.
  #
  # The Python extension links against libiriscolor and exposes its native
  # color-distance implementation through irislab._native.
  #
  # No pip/pyproject.toml packaging is used. The Python package and compiled
  # extension are installed directly into the Conda environment.
  # -------------------------------------------------------------------------
  - name: irislab-tools
    version: {{ version }}

    script: >-                                                    # [unix]
      cmake -S "${SRC_DIR}/cpp" -B build-tools -G Ninja
      -DCMAKE_BUILD_TYPE=Release
      -DIRISCOLOR_BUILD_BINDINGS=ON
      -DCMAKE_PREFIX_PATH="${PREFIX}"
      && cmake --build build-tools
      && mkdir -p "${SP_DIR}/irislab"
      && cp "${SRC_DIR}"/src/irislab/*.py "${SP_DIR}/irislab/"
      && cp build-tools/_native*.so "${SP_DIR}/irislab/"

    script: >-                                                    # [win]
      cmake -S "%SRC_DIR%\cpp" -B build-tools -G Ninja
      -DCMAKE_BUILD_TYPE=Release
      -DIRISCOLOR_BUILD_BINDINGS=ON
      -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%"
      && cmake --build build-tools
      && if not exist "%SP_DIR%\irislab" mkdir "%SP_DIR%\irislab"
      && copy "%SRC_DIR%\src\irislab\*.py" "%SP_DIR%\irislab\"
      && copy "build-tools\_native*.pyd" "%SP_DIR%\irislab\"

    build:
      entry_points:
        - irislab = irislab.cli:main

    requirements:
      build:
        - "{{ compiler('cxx') }}"
        - cmake
        - ninja

      host:
        - python >=3.12
        - pybind11 >=2.12
        - {{ pin_subpackage('libiriscolor', exact=True) }}

      run:
        - python >=3.12
        - click
        - pillow
        - rich
        - numpy
        - libgl
        - libegl
        - libgles
        - {{ pin_subpackage('libiriscolor', exact=True) }}

    test:
      requires:
        - pip

      imports:
        - irislab
        - irislab._native

      commands:
        - python -m pip install mediapipe
        - irislab --help

about:
  home: https://github.com/ValentinTwin1206/modern-python-engineering
  summary: Native and Python tools for iris segmentation and perceptual color analysis.
  description: |
    IrisLab demonstrates a Conda-only Python and C++ application for
    iris-color analysis.

    It ships as two Conda packages:

      * libiriscolor
        A standalone C++ shared library implementing perceptual CIELAB
        color-distance calculations.

      * irislab-tools
        The Python API, command-line interface, image-analysis pipeline,
        and pybind11 bindings that link against libiriscolor.

    The application extracts iris pigmentation from images, analyzes color
    characteristics using NumPy, and uses the native C++ library for
    perceptual color-distance calculations.

  license: Apache-2.0