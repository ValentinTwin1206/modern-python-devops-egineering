config:
  target: "http://backend:8080"

  phases:
    # One virtual user sends 120 requests from the same source IP.
    - duration: 60
      arrivalCount: 1
      name: "Iris API authentication brute-force limit"

  processor: "./helpers/test-helpers.cjs"

scenarios:
  - name: "PyGuard counts 401 and 403 responses"
    flow:
      # Repeat 401 then 403 60 times to exceed the configured 100-attempt limit.
      - loop:
          - get:
              url: "/api/v1/analyses"
              afterResponse: "checkPyGuardResponse"
          - get:
              url: "/api/v1/analyses"
              beforeRequest: "setForbiddenTestToken"
              afterResponse: "checkPyGuardResponse"
        count: 60