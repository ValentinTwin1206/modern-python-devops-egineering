  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    depends_on:
      - backend
      - frontend
    volumes:
      - .:/workspace:cached
    working_dir: /workspace
    extra_hosts:
      - "keycloak.localhost:172.30.0.1"
    environment:
      PLAYWRIGHT_HOST_GATEWAY: 172.30.0.1
      KEYCLOAK_TEST_USERNAME: ${KEYCLOAK_TEST_USERNAME}
      KEYCLOAK_TEST_PASSWORD: ${KEYCLOAK_TEST_PASSWORD}
    networks:
      irislab_network:

  backend:
    build:
      context: ../proj3_irislab_api
      args:
        IRISLAB_CHANNEL: https://conda.cloudsmith.io/${CLOUDSMITH_OWNER}/${CLOUDSMITH_REPOSITORY}/
      secrets:
        - cloudsmith_api_key
    ports:
      - "8080:8080"
    networks:
      irislab_network:
        ipv4_address: ${IRIS_API_IP}

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_healthy
    ports:
      - "8501:8501"
    extra_hosts:
      # Resolve the host-published Keycloak endpoint from inside the container.
      # Use IPv4 explicitly; host-gateway also adds an unreachable IPv6 entry
      # in Docker Desktop/WSL, which makes httpx fail before trying IPv4.
      - "keycloak.localhost:172.30.0.1"
    volumes:
      # The entrypoint copies this template and generates a fresh cookie secret
      # on every container start, invalidating browser login cookies from older runs.
      - ./frontend/.streamlit/secrets.toml:/run/secrets/streamlit-secrets.toml:ro
    networks:
      irislab_network:
        ipv4_address: ${FRONTEND_IP}
    environment:
      IRIS_API_URL: http://backend:8080

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD", "bash", "-c", ":</dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME}
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      irislab_network:
        ipv4_address: ${KEYCLOAK_IP}

  loki:
    image: grafana/loki:3.4.2
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./logging/loki/config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    networks:
      irislab_network:
        ipv4_address: ${LOKI_IP}

  alloy:
    image: grafana/alloy:v1.8.3
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    volumes:
      - ./logging/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    networks:
      irislab_network:
        ipv4_address: ${ALLOY_IP}

  influxdb:
    image: influxdb:2.7
    container_name: influxdb
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      irislab_network:
        ipv4_address: ${INFLUXDB_IP}
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    env_file:
      - .env
    depends_on:
      influxdb:
        condition: service_healthy
      loki:
        condition: service_started
    networks:
      irislab_network:
        ipv4_address: ${GRAFANA_IP}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana

networks:
  irislab_network:
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  influxdb_data:
  grafana_data:
  loki_data:
  alloy_data:

secrets:
  cloudsmith_api_key:
    environment: CLOUDSMITH_API_KEY
