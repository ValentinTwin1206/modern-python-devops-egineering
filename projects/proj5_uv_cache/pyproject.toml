[project]
name = "uv-cache-demo"
version = "0.1.0"
description = "A local wheel and ML dependencies for demonstrating uv's CI cache."
requires-python = ">=3.12,<3.13"
dependencies = [
    "tensorflow-cpu>=2.20,<2.21",
    "transformers>=4.57,<5",
    "scikit-learn>=1.7,<2",
]

[build-system]
requires = ["uv_build==0.11.1"]
build-backend = "uv_build"

[tool.uv]
# Compute this fingerprint before syncing; see scripts/build_key.py and README.md.
# File timestamps change on fresh CI checkouts, even when the contents do not.
cache-keys = [{ env = "UV_CACHE_DEMO_BUILD_KEY" }]
