[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[project]
name = "pyguard"
version = "0.1.0"
description = "Lightweight security middleware for Python web applications."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Julius Pravtchev" },
    { name = "Valentin Pravtchev" }
]

dependencies = []

[dependency-groups]
dev = [
    "karva>=0.0.1a5",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py39"
line-length = 88
