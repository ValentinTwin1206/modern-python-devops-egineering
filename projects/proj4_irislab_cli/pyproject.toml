[project]
name = "irislab-cli"
version = "1.0.0"
description = "Interactive OIDC-authenticated client for the IrisLab API"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7,<9",
    "requests>=2.32,<3",
]

[project.scripts]
iris-cli = "irislab_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = true

[build-system]
requires = ["uv_build>=0.11.8,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]