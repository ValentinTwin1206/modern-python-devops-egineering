# Demonstrates uv cache reuse when installing the ML dependencies.
# GitHub Actions persists the cache across eligible workflow runs when the key
# matches. Entries not accessed for over 7 days expire; storage pressure may
# evict them sooner.
#
# Workflow steps:
# - Check out the repository and set up Python 3.12 and uv.
# - Restore the uv package cache, keyed by pyproject.toml and uv.lock.
# - Optionally clear the restored cache before installation.
# - Sync into a fresh .venv and verify the ML packages.
# - Measure the cache and optionally prune downloaded wheels for CI.
# - Report cache status, sizes, and uv sync duration.
# `clean_cache` clears the restored cache before installation; `prune_cache`
# runs `uv cache prune --ci` after installation, even on an exact cache hit.
name: uv cache demo (ML dependencies)

on:
  workflow_dispatch:
    inputs:
      prune_cache:
        description: "Run uv cache prune --ci after installation"
        type: boolean
        default: true
      clean_cache:
        description: "Run uv cache clean before installing (cold run)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  install-ml-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Dependency files and the ml-demo suffix help form the cache key.
      # Matching caches are reused across eligible runs; entries expire after
      # 7 days without access, and storage pressure can evict them sooner.
      # Separate keys keep full and CI-pruned cache experiments independent.
      - name: Set up uv and restore its package cache
        id: uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: |
            projects/proj5_uv_cache/pyproject.toml
            projects/proj5_uv_cache/uv.lock
          cache-suffix: ${{ inputs.prune_cache && 'ml-demo-ci-pruned' || 'ml-demo-full' }}
          # Prune explicitly below so size changes are visible, including on hits.
          prune-cache: false

      - name: Clear uv cache for a cold install
        if: ${{ inputs.clean_cache }}
        run: uv cache clean

      # .venv is recreated each run; only uv's package cache persists.
      # `--locked` uses the committed uv.lock and fails if it needs updating,
      # keeping each timed install reproducible without changing the lockfile.
      - name: Install ML packages into a fresh virtual environment
        id: install
        shell: bash
        run: |
          start_ms=$(date +%s%3N)
          uv sync --directory projects/proj5_uv_cache --locked --python 3.12
          end_ms=$(date +%s%3N)
          echo "milliseconds=$((end_ms - start_ms))" >> "$GITHUB_OUTPUT"

      - name: Verify the ML dependencies
        run: |
          projects/proj5_uv_cache/.venv/bin/python -c \
            "import tensorflow, transformers, sklearn; print('ML packages imported successfully')"

      - name: Measure cache and optionally prune for CI
        id: cache_size
        shell: bash
        env:
          PRUNE_CACHE: ${{ inputs.prune_cache }}
        run: |
          cache_dir=$(uv cache dir)
          before_kib=$(du -sk "$cache_dir" | cut -f1)
          if [[ "$PRUNE_CACHE" == "true" ]]; then
            uv cache prune --ci
          fi
          after_kib=$(du -sk "$cache_dir" | cut -f1)
          {
            echo "before_kib=$before_kib"
            echo "after_kib=$after_kib"
            echo "reclaimed_kib=$((before_kib - after_kib))"
          } >> "$GITHUB_OUTPUT"

      # This times only uv sync, not the GitHub cache download or upload.
      - name: Show cache and installation time
        env:
          CACHE_HIT: ${{ steps.uv.outputs.cache-hit }}
          CACHE_CLEARED: ${{ inputs.clean_cache }}
          CACHE_PRUNED: ${{ inputs.prune_cache }}
          INSTALL_MS: ${{ steps.install.outputs.milliseconds }}
          CACHE_BEFORE_KIB: ${{ steps.cache_size.outputs.before_kib }}
          CACHE_AFTER_KIB: ${{ steps.cache_size.outputs.after_kib }}
          CACHE_RECLAIMED_KIB: ${{ steps.cache_size.outputs.reclaimed_kib }}
        run: |
          {
            echo '## uv cache demo'
            echo ''
            echo '| Measurement | Result |'
            echo '| --- | --- |'
            echo "| Cache restored before optional clearing | $CACHE_HIT |"
            echo "| Local cache cleared before install | $CACHE_CLEARED |"
            echo "| CI pruning performed after install | $CACHE_PRUNED |"
            echo "| Cache size before optional CI pruning | ${CACHE_BEFORE_KIB} KiB |"
            echo "| Cache size after optional CI pruning | ${CACHE_AFTER_KIB} KiB |"
            echo "| Cache space reclaimed | ${CACHE_RECLAIMED_KIB} KiB |"
            echo "| uv sync duration | ${INSTALL_MS} ms |"
            echo ''
            echo 'Exact cache-key hits are not overwritten; these sizes describe the local cache after installation.'
          } >> "$GITHUB_STEP_SUMMARY"
