# Persist uv's package cache, not .venv.
# Cold experiments skip restoration and saving on fresh GitHub-hosted runners.
name: uv cache demo

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "uv cache strategy"
        type: choice
        default: ci-pruned
        options:
          - cold
          - warm
          - ci-pruned
      fixture_size:
        description: "Embedding matrix size (MiB)"
        type: choice
        default: "256"
        options:
          - "16"
          - "64"
          - "256"
          - "512"
          - "1024"

permissions:
  contents: read

jobs:
  analyze-embeddings:
    runs-on: ubuntu-latest
    env:
      CACHE_STRATEGY: ${{ inputs.strategy || 'ci-pruned' }}
      fixture_size: ${{ inputs.fixture_size || '256' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Generate before hashing: both the metadata and binary enter both keys.
      # Keep the project's content fingerprint for uv's local wheel cache.
      - name: Generate fixture and fingerprint build inputs
        run: |
          python notebooks/nb5_uv_cache_lab/scripts/generate_fixture.py --size "$fixture_size"
          build_key=$(python notebooks/nb5_uv_cache_lab/scripts/build_key.py)
          echo "CACHE_DEMO_KEY=$build_key" >> "$GITHUB_ENV"

      # TODO: Add the `astral-sh/setup-uv` step here, before cache measurement
      # and `uv sync`. The later steps require `uv` on PATH and read the action's
      # `cache-hit` output, so give the step `id: uv`.
      #
      # Pin the action to a reviewed full commit SHA (with a version comment),
      # and install the same uv version used by this experiment. Enable its
      # package cache; do not cache the project `.venv`, which is created fresh
      # by `uv sync` on each hosted runner.
      #
      # Select cache behavior from `CACHE_STRATEGY`:
      #   - cold: skip restore and save, so remote entries stay unchanged.
      #   - warm: restore and auto-save without pruning; use a distinct suffix
      #     (`full-cache-demo`) to keep the complete cache separate.
      #   - ci-pruned: restore and auto-save; enable CI pruning before saving.
      #
      # Example input expressions (place under the step's `with:`):
      #   version: "0.11.1"
      #   enable-cache: true
      #   restore-cache: ${{ env.CACHE_STRATEGY != 'cold' }}
      #   save-cache: ${{ env.CACHE_STRATEGY == 'cold' && 'false' || 'auto' }}
      #   prune-cache: ${{ env.CACHE_STRATEGY == 'ci-pruned' }}
      #   cache-suffix: ${{ env.CACHE_STRATEGY == 'warm' && 'full-cache-demo' || '' }}
      #
      # Set `cache-dependency-glob` to the project lock/configuration and all
      # local build inputs. Include pyproject.toml, uv.lock, scripts/*.py,
      # src/**/*.py, src/**/*.json, and src/**/*.bin under
      # notebooks/nb5_uv_cache_lab so generated fixture data invalidates the
      # remote cache key as well as the local wheel fingerprint.

      - name: Measure restored package cache size
        run: |
          mkdir -p "$UV_CACHE_DIR"
          bytes=$(du -sb "$UV_CACHE_DIR" | cut -f1)
          echo "RESTORED_CACHE_BYTES=$bytes" >> "$GITHUB_ENV"
          echo "RESTORED_CACHE_SIZE=$(numfmt --to=iec-i --suffix=B "$bytes")" >> "$GITHUB_ENV"

      # A fresh hosted runner has no project .venv; only the package cache is restored.
      # Time only uv sync, excluding generation, cache transfer, and the report.
      - name: Create a fresh environment from locked dependencies
        id: install
        shell: bash
        run: |
          start_ms=$(date +%s%3N)
          uv sync \
            --directory notebooks/nb5_uv_cache_lab \
            --locked \
            --no-editable \
            --python 3.12
          end_ms=$(date +%s%3N)
          echo "milliseconds=$((end_ms - start_ms))" >> "$GITHUB_OUTPUT"

      - name: Analyze the installed embeddings and generate a report
        run: |
          notebooks/nb5_uv_cache_lab/.venv/bin/python -m uv_cache_demo.main \
            --output "${{ runner.temp }}/embeddings.png"

      - name: Show cache and installation time
        env:
          RESTORE_STATUS: ${{ env.CACHE_STRATEGY == 'cold' && 'Skipped' || (steps.uv.outputs.cache-hit == 'true' && 'Restored' || 'Not restored') }}
          INSTALL_MS: ${{ steps.install.outputs.milliseconds }}
        run: |
          cache_bytes=$(du -sb "$UV_CACHE_DIR" | cut -f1)
          cache_size=$(numfmt --to=iec-i --suffix=B "$cache_bytes")
          echo "RESTORED_CACHE_SIZE=$RESTORED_CACHE_SIZE ($RESTORED_CACHE_BYTES bytes)"
          echo "CACHE_SIZE_AFTER_SYNC=$cache_size ($cache_bytes bytes; before setup-uv post-action pruning)"
          {
            echo '## uv cache demo'
            echo ''
            echo '| Measurement | Result |'
            echo '| --- | --- |'
            echo "| Embedding matrix size | ${fixture_size} MiB |"
            echo "| setup-uv cache restoration | $RESTORE_STATUS |"
            echo "| Cache strategy | $CACHE_STRATEGY |"
            echo "| Restored local uv cache | $RESTORED_CACHE_SIZE |"
            echo "| uv sync duration | ${INSTALL_MS} ms |"
            echo "| Local uv cache after sync, before post-action pruning | $cache_size |"
            echo ''
            echo 'Duration measures only uv sync; it excludes GitHub cache restoration and saving time.'
            echo 'Cold experiments skip cache restoration and saving; remote archives remain unchanged.'
            echo 'Only runs reporting Restored qualify as warm-cache measurements.'
            echo 'Compare multiple runs with unchanged dependencies and build inputs; no speedup is guaranteed.'
          } >> "$GITHUB_STEP_SUMMARY"
